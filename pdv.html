<!DOCTYPE html>
<!-- NEXUS_FIXED_URL_SHELL_V8 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SIR BEEF — Central Web de PDVs</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0d;
      color: #f3d87d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #sbSplash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0d;
      z-index: 20;
      transition: opacity 0.25s ease;
      text-align: center;
      padding: 20px;
    }
    #sbSplash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid #272732;
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #sbLiveFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      background: #0a0a0d;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="sbSplash">
    <div class="spinner"></div>
    <div style="font-size:17px;font-weight:800;letter-spacing:0.5px;">🍽️ SIR BEEF</div>
    <div id="sbStatusText" style="color:#9ca3af;font-size:13px;margin-top:6px;">Conectando em Tempo Real (4G / Wi-Fi)...</div>
  </div>
  <iframe
    id="sbLiveFrame"
    allow="clipboard-read; clipboard-write; geolocation; camera; microphone; autoplay; fullscreen"
    allowfullscreen
  ></iframe>
  <script>
    (function() {
      const ROUTE_PATH = "/pdv";
      const GH_OWNER = "nexusistemas";
      const GH_REPO = "sirbeefcardapio";
      const frame = document.getElementById("sbLiveFrame");
      const splash = document.getElementById("sbSplash");
      let activeTunnelBase = "";
      let isChecking = false;

      frame.addEventListener("load", function() {
        if (activeTunnelBase) {
          splash.classList.add("hidden");
        }
      });

      async function probeEndpointHealth(baseUrl) {
        if (!baseUrl) return false;
        const clean = String(baseUrl).replace(/\/$/, "");
        const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        const tid = ctrl ? setTimeout(function() { ctrl.abort(); }, 3500) : null;
        try {
          const r = await fetch(clean + "/api/health?t=" + Date.now(), {
            cache: "no-store",
            signal: ctrl ? ctrl.signal : undefined
          });
          if (tid) clearTimeout(tid);
          return !!(r && r.ok);
        } catch (e) {
          if (tid) clearTimeout(tid);
          return false;
        }
      }

      async function fetchTunnelData() {
        const ts = Date.now();
        const rawCandidates = [
          "https://raw.githubusercontent.com/" + GH_OWNER + "/" + GH_REPO + "/main/tunnel.json?t=" + ts,
          "https://raw.githubusercontent.com/" + GH_OWNER + "/" + GH_OWNER + ".github.io/main/tunnel.json?t=" + ts,
          "https://raw.githubusercontent.com/nexusistemas/sirbeefcardapio/main/tunnel.json?t=" + ts,
          "https://raw.githubusercontent.com/nexusistemas/nexusistemas.github.io/main/tunnel.json?t=" + ts
        ];
        for (const u of rawCandidates) {
          try {
            const rRaw = await fetch(u, { cache: "no-store" });
            if (rRaw.ok) {
              const j = await rRaw.json();
              if (j && (j.tunnel_url || j.lan_url)) return j;
            }
          } catch (e) {}
        }
        const apiCandidates = [
          "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/tunnel.json?t=" + ts,
          "https://api.github.com/repos/" + GH_OWNER + "/" + GH_OWNER + ".github.io/contents/tunnel.json?t=" + ts
        ];
        for (const u of apiCandidates) {
          try {
            const rApi = await fetch(u, {
              headers: { "Accept": "application/vnd.github.raw+json" },
              cache: "no-store"
            });
            if (rApi.ok) {
              const j = await rApi.json();
              if (j && (j.tunnel_url || j.lan_url)) return j;
            }
          } catch (e) {}
        }
        for (const rel of ["./tunnel.json", "../tunnel.json", "/tunnel.json"]) {
          try {
            const rPages = await fetch(rel + "?t=" + ts, { cache: "no-store" });
            if (rPages.ok) {
              const j2 = await rPages.json();
              if (j2 && (j2.tunnel_url || j2.lan_url)) return j2;
            }
          } catch (e2) {}
        }
        return null;
      }

      async function syncTunnelAndLoad() {
        if (isChecking) return;
        isChecking = true;
        try {
          const d = await fetchTunnelData();
          if (!d) return;
          const candidates = [];
          if (d.tunnel_url) candidates.push(String(d.tunnel_url).replace(/\/$/, ""));
          if (d.lan_url) candidates.push(String(d.lan_url).replace(/\/$/, ""));
          for (const cand of candidates) {
            if (!cand) continue;
            if (cand === activeTunnelBase) return;
            const alive = await probeEndpointHealth(cand);
            if (alive) {
              activeTunnelBase = cand;
              const qs = window.location.search || "";
              const hash = window.location.hash || "";
              frame.src = activeTunnelBase + ROUTE_PATH + qs + hash;
              setTimeout(function() { splash.classList.add("hidden"); }, 900);
              return;
            }
          }
        } catch (e) {
        } finally {
          isChecking = false;
        }
      }

      syncTunnelAndLoad();
      setInterval(function() { syncTunnelAndLoad(); }, 10000);
    })();
  </script>
</body>
</html>
